<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OpenSC4 WebAssembly</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #101923; color: #e2e8f0; font-family: system-ui, sans-serif; }
    #canvas { width: 100%; height: 100%; display: block; }
    #toolbar {
      position: fixed; top: 12px; left: 12px; display: flex; align-items: center; gap: 10px;
      padding: 9px 12px; border: 1px solid #355473; border-radius: 8px;
      background: rgba(15, 27, 40, .92); box-shadow: 0 6px 18px rgba(0,0,0,.4);
    }
    #brand { color: #38bdf8; font-weight: 800; letter-spacing: .04em; }
    #openButton { padding: 6px 10px; border: 1px solid #47739b; border-radius: 5px; background: #1e3549; color: white; cursor: pointer; }
    #fileInput { display: none; }
    #status { color: #a9bed0; font-size: 12px; }
    #dropHint {
      position: fixed; inset: 74px 20px 20px; display: none; place-items: center;
      border: 3px dashed #38bdf8; border-radius: 16px; background: rgba(2, 132, 199, .18);
      color: white; font-size: 24px; font-weight: 700; pointer-events: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  <div id="toolbar">
    <span id="brand">OPENSC4 · WASM</span>
    <label id="openButton" for="fileInput">Open .sc4 City</label>
    <input id="fileInput" type="file" accept=".sc4">
    <span id="status">OpenGFX procedural city · drop a local .sc4 save anywhere</span>
  </div>
  <div id="dropHint">Drop .sc4 city to load</div>
  <script>
    const canvas = document.getElementById('canvas');
    const status = document.getElementById('status');
    const dropHint = document.getElementById('dropHint');
    function resizeCanvas() {
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.max(1, Math.floor(innerWidth * ratio));
      canvas.height = Math.max(1, Math.floor(innerHeight * ratio));
    }
    resizeCanvas();
    addEventListener('resize', resizeCanvas);

    var Module = {
      canvas,
      print: text => console.log(text),
      printErr: text => console.error(text)
    };

    async function loadSC4(file) {
      if (!file || !file.name.toLowerCase().endsWith('.sc4')) {
        status.textContent = 'Please choose a SimCity 4 .sc4 city save.';
        return;
      }
      status.textContent = `Loading ${file.name}…`;
      try {
        const bytes = new Uint8Array(await file.arrayBuffer());
        const ptr = Module._malloc(bytes.byteLength);
        HEAPU8.set(bytes, ptr);
        const loaded = Module.ccall('opensc4_wasm_load_sc4', 'number',
          ['number', 'number'], [ptr, bytes.byteLength]);
        Module._free(ptr);
        status.textContent = loaded
          ? `${file.name} loaded locally · ${Math.round(bytes.byteLength / 1048576 * 10) / 10} MB`
          : `${file.name} is not a supported DBPF city save.`;
      } catch (error) {
        console.error(error);
        status.textContent = `Could not load ${file.name}.`;
      }
    }

    document.getElementById('fileInput').addEventListener('change', event => loadSC4(event.target.files[0]));
    for (const eventName of ['dragenter', 'dragover']) {
      addEventListener(eventName, event => {
        event.preventDefault();
        dropHint.style.display = 'grid';
      });
    }
    for (const eventName of ['dragleave', 'drop']) {
      addEventListener(eventName, event => {
        event.preventDefault();
        dropHint.style.display = 'none';
      });
    }
    addEventListener('drop', event => loadSC4(event.dataTransfer.files[0]));
  </script>
  {{{ SCRIPT }}}
</body>
</html>
